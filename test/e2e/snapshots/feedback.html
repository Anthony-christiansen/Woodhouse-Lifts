<div class="card">
      <h3>How’s the app working for you?</h3>
      <div class="stars" role="group" aria-label="Rating, 1 to 5 stars"><button type="button" data-star="1" aria-pressed="false" aria-label="1 star">★</button><button type="button" data-star="2" aria-pressed="false" aria-label="2 stars">★</button><button type="button" data-star="3" aria-pressed="false" aria-label="3 stars">★</button><button type="button" data-star="4" aria-pressed="false" aria-label="4 stars">★</button><button type="button" data-star="5" aria-pressed="false" aria-label="5 stars">★</button></div>
      <div class="lbl">What’s it about?</div>
      <div class="seg c2" id="fbKind" role="group" aria-label="What it's about"><button type="button" data-kind="idea" aria-pressed="true" class="on">Idea</button><button type="button" data-kind="bug" aria-pressed="false" class="">Something’s wrong</button><button type="button" data-kind="praise" aria-pressed="false" class="">Praise</button><button type="button" data-kind="other" aria-pressed="false" class="">Other</button></div>
      <label for="fbMsg" class="mt6">Tell us more <span class="muted tiny">(optional if you picked stars)</span></label>
      <textarea id="fbMsg" rows="5" maxlength="2000" placeholder="What happened, what you expected, or what you'd like…"></textarea>
      <div class="muted tiny" id="fbCount">0 / 2000</div>
      <button class="primary block mt6" id="fbSend" disabled="">Send</button>
      <p class="muted tiny">Goes to the app owner with the app version and the screen you came from. No health notes needed — keep it about the app.</p>
    </div>
